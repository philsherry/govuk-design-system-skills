---
name: Lint

on:
  pull_request:
    paths:
      - "agents/**/*.md"
      - "govuk-design-system/**/*.md"

jobs:
  write-good:
    name: write-good
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Check passive voice
        run: npm test
