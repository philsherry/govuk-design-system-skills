---
name: Lint

on:
  pull_request:
    paths:
      - ".github/workflows/lint.yml"
      - ".github/workflows/tag-release.yml"
      - "CHANGELOG.md"
      - "docs/**/*.md"
      - "dwp-design-system/**/*.md"
      - "govuk-design-system/**/*.md"
      - "hmrc-design-patterns/**/*.md"
      - "nhsuk-design-system/**/*.md"
      - "package-lock.json"
      - "package.json"
      - "playback.config.ts"
      - "scripts/check-release-version.cjs"
      - "scripts/lint-write-good.cjs"
      - "scripts/release-notes-from-changelog.cjs"
      - "tapes/**/*.md"
      - "tapes/**/*.yaml"

jobs:
  write-good:
    name: write-good
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Check release metadata
        run: npm run release:check

      - name: Check passive voice
        run: npm test

      - name: Run advisory prose lint
        run: npm run lint
        continue-on-error: true
