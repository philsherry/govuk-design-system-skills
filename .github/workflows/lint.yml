---
name: Lint

on:
  pull_request:
    paths:
      - ".github/workflows/lint.yml"
      - "docs/**/*.md"
      - "govuk-design-system/**/*.md"
      - "hmrc-design-patterns/**/*.md"
      - "nhsuk-design-system/**/*.md"
      - "package-lock.json"
      - "package.json"
      - "scripts/lint-write-good.js"

jobs:
  write-good:
    name: write-good
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Check passive voice
        run: npm test

      - name: Run advisory prose lint
        run: npm run lint
        continue-on-error: true
